name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux · swift build (warnings as errors) + swift test
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  apple:
    name: macOS 15 · swift test + iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme AgentJobRelay -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
